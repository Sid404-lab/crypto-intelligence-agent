name: Daily Crypto Intelligence Report

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:  # Allow manual triggering

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate crypto intelligence report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd agent
          python run.py

      - name: Save daily history snapshot
        run: |
          mkdir -p data/history
          cp data/latest-report.json "data/history/$(date -u +%F).json"
      
      - name: Copy report to frontend
        run: |
          mkdir -p frontend/data
          cp data/latest-report.json frontend/data/latest-report.json
      
      - name: Commit and push updated report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/latest-report.json data/history/*.json frontend/data/latest-report.json
          git diff --staged --quiet || git commit -m "Update daily crypto intelligence report [skip ci]"
          git pull --rebase origin main
          git push origin main
